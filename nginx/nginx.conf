# =============================================================================
# Provest — production Nginx configuration
# Domain  : https://provest.ir
# API     : /api/* → PHP-FPM → provest-api/public/index.php
# Frontend: /*     → provest-front/dist  (React SPA)
#
# Before enabling, set the correct paths for:
#   - ssl_certificate / ssl_certificate_key
#   - root paths (PROVEST_ROOT below)
#   - fastcgi_pass socket/address matching your PHP-FPM pool
# =============================================================================

# --- HTTP → HTTPS redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name provest.ir www.provest.ir;

    return 301 https://provest.ir$request_uri;
}

# --- HTTPS main server -------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name provest.ir;

    # --- SSL -----------------------------------------------------------------
    ssl_certificate     /etc/ssl/provest.ir/fullchain.pem;
    ssl_certificate_key /etc/ssl/provest.ir/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers ----------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- React SPA document root ---------------------------------------------
    root  /var/www/provest/provest-front/dist;
    index index.html;

    # --- Logging -------------------------------------------------------------
    access_log /var/log/nginx/provest.access.log;
    error_log  /var/log/nginx/provest.error.log warn;

    # --- Laravel API: /api/* -------------------------------------------------
    # All requests under /api/ are passed directly to Laravel's front
    # controller. No try_files here — every /api/ path is handled by Laravel.
    location /api/ {
        fastcgi_pass   unix:/var/run/php/php8.3-fpm.sock;

        fastcgi_param  SCRIPT_FILENAME  /var/www/provest/provest-api/public/index.php;
        fastcgi_param  DOCUMENT_ROOT    /var/www/provest/provest-api/public;

        # Pass the original URI so Laravel routing works correctly
        fastcgi_param  REQUEST_URI      $request_uri;

        include        fastcgi_params;

        fastcgi_read_timeout        300;
        fastcgi_buffers             16 16k;
        fastcgi_buffer_size         32k;
    }

    # --- Laravel health check: /up -------------------------------------------
    location = /up {
        fastcgi_pass   unix:/var/run/php/php8.3-fpm.sock;

        fastcgi_param  SCRIPT_FILENAME  /var/www/provest/provest-api/public/index.php;
        fastcgi_param  DOCUMENT_ROOT    /var/www/provest/provest-api/public;
        fastcgi_param  REQUEST_URI      $request_uri;

        include        fastcgi_params;
    }

    # --- React SPA: everything else ------------------------------------------
    # Serve static assets directly; fall back to index.html for client-side
    # routes so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Static asset caching ------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # --- Block access to hidden files ----------------------------------------
    location ~ /\. {
        deny all;
    }
}
