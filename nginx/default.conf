# =============================================================================
# Provest — Docker Nginx configuration
# Domain : https://provest.ir
#
# Traffic flow:
#   /api/*  → FastCGI TCP → laravel:9000 (PHP-FPM)
#   /up     → FastCGI TCP → laravel:9000 (Laravel health endpoint)
#   /*      → /usr/share/nginx/html     (React SPA, with fallback)
#
# SSL certificates are mounted from the host:
#   /etc/letsencrypt/live/provest.ir/fullchain.pem
#   /etc/letsencrypt/live/provest.ir/privkey.pem
#
# To obtain certs before first run (run on host, not inside Docker):
#   certbot certonly --standalone -d provest.ir --email you@provest.ir --agree-tos
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP — redirect everything to HTTPS
# The /.well-known/acme-challenge/ block lets certbot renew without downtime.
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name provest.ir www.provest.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://provest.ir$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main production server
# ---------------------------------------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name provest.ir;

    # ── TLS ------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/provest.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/provest.ir/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Security headers -----------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ── Document root (React SPA) --------------------------------------------
    root  /usr/share/nginx/html;
    index index.html;

    # ── Laravel API: /api/* --------------------------------------------------
    # All requests matching /api/ are forwarded directly to Laravel's
    # front controller via FastCGI over TCP (Docker service name = laravel).
    # No try_files here — every /api/ path is owned by Laravel routing.
    location /api/ {
        fastcgi_pass  laravel:9000;

        # Tell PHP-FPM which script to run (always Laravel's index.php).
        fastcgi_param SCRIPT_FILENAME  /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT    /var/www/html/public;

        # Forward the full original URI so Laravel routing works correctly.
        fastcgi_param REQUEST_URI      $request_uri;

        # Pass real client info to Laravel (available via $request->ip() etc.)
        fastcgi_param HTTP_HOST                $host;
        fastcgi_param HTTPS                    on;
        fastcgi_param SERVER_PORT              443;
        fastcgi_param HTTP_X_FORWARDED_FOR     $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO   https;
        fastcgi_param HTTP_X_REAL_IP           $remote_addr;

        include fastcgi_params;

        fastcgi_connect_timeout  60s;
        fastcgi_read_timeout     300s;
        fastcgi_buffers          16 16k;
        fastcgi_buffer_size      32k;
    }

    # ── Laravel health check: /up --------------------------------------------
    location = /up {
        fastcgi_pass  laravel:9000;

        fastcgi_param SCRIPT_FILENAME  /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT    /var/www/html/public;
        fastcgi_param REQUEST_URI      $request_uri;
        fastcgi_param HTTPS            on;

        include fastcgi_params;
    }

    # ── React SPA — all other routes -----------------------------------------
    # Serve static files directly; fall back to index.html so React Router
    # can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching -------------------------------------------------
    # Vite appends a content hash to every JS/CSS filename, so we can cache
    # them indefinitely with Cache-Control: immutable.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Block hidden files ---------------------------------------------------
    location ~ /\. {
        deny all;
    }
}
