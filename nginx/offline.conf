# =============================================================================
# Provest — Nginx offline / HTTP-only config
# Used when SSL is not available (air-gapped server, initial deploy).
# Serve React SPA on port 80, proxy /api/* to Laravel via FastCGI.
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;   # accept any hostname or IP

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss
                    text/javascript image/svg+xml font/woff font/woff2;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;

    # ── Document root (React SPA) ─────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # ── Laravel API: /api/* ───────────────────────────────────────────────────
    location /api/ {
        fastcgi_pass  laravel:9000;

        fastcgi_param SCRIPT_FILENAME  /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT    /var/www/html/public;
        fastcgi_param REQUEST_URI      $request_uri;

        fastcgi_param HTTP_HOST              $host;
        fastcgi_param HTTPS                  off;
        fastcgi_param SERVER_PORT            80;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP         $remote_addr;

        include fastcgi_params;

        fastcgi_connect_timeout  60s;
        fastcgi_read_timeout     300s;
        fastcgi_buffers          16 16k;
        fastcgi_buffer_size      32k;
    }

    # ── Laravel health check: /up ─────────────────────────────────────────────
    location = /up {
        fastcgi_pass  laravel:9000;

        fastcgi_param SCRIPT_FILENAME  /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT    /var/www/html/public;
        fastcgi_param REQUEST_URI      $request_uri;

        include fastcgi_params;
    }

    # ── React SPA — all other routes ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Block hidden files ────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
